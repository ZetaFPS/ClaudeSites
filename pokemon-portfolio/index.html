<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f1a">
  <title>PokéFolio</title>
  <meta name="description" content="Scan Pokémon cards, track your collection, and watch its market value.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23fff' stroke='%23111' stroke-width='2'/%3E%3Cpath d='M2 16a14 14 0 0 1 28 0z' fill='%23ef4444' stroke='%23111' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23fff' stroke='%23111' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-ball" aria-hidden="true"></span>
        <span>PokéFolio</span>
      </div>
      <button class="icon-btn" id="refreshBtn" title="Refresh market prices" aria-label="Refresh market prices">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </header>

    <main>
      <!-- PORTFOLIO -->
      <section class="view active" id="view-portfolio" aria-label="Portfolio">
        <div class="hero">
          <div class="hero-label">Portfolio value</div>
          <div class="hero-value" id="totalValue">$0.00</div>
          <div class="hero-change" id="totalChange"></div>
          <div class="hero-sub" id="priceUpdated"></div>
        </div>

        <div class="chart-card">
          <div class="range-tabs" role="tablist" aria-label="Chart range">
            <button data-range="7" role="tab">1W</button>
            <button data-range="30" role="tab" class="active">1M</button>
            <button data-range="90" role="tab">3M</button>
            <button data-range="365" role="tab">1Y</button>
            <button data-range="0" role="tab">All</button>
          </div>
          <div class="chart-wrap" id="chart">
            <svg id="chartSvg" role="img" aria-label="Portfolio value over time"></svg>
            <div class="chart-tip" id="chartTip" hidden></div>
            <div class="chart-empty" id="chartEmpty" hidden></div>
          </div>
        </div>

        <div class="stats">
          <div class="stat"><div class="stat-label">Cards</div><div class="stat-value" id="statCards">0</div></div>
          <div class="stat"><div class="stat-label">Cost basis</div><div class="stat-value" id="statCost">$0.00</div></div>
          <div class="stat"><div class="stat-label">Total gain</div><div class="stat-value" id="statGain">$0.00</div></div>
        </div>

        <div class="list-head">
          <h2>My Cards</h2>
          <div class="list-tools">
            <input type="search" id="filterInput" placeholder="Filter…" aria-label="Filter cards">
            <select id="sortSelect" aria-label="Sort cards">
              <option value="value">Value ↓</option>
              <option value="recent">Recently added</option>
              <option value="name">Name A–Z</option>
              <option value="set">Set</option>
              <option value="gain">Gain ↓</option>
            </select>
          </div>
        </div>
        <div class="card-list" id="cardList"></div>
        <div class="empty-state" id="emptyState" hidden>
          <div class="empty-art" aria-hidden="true"></div>
          <h3>Your binder is empty</h3>
          <p>Scan a card with your camera or search for it to start tracking your collection's value.</p>
          <button class="btn primary" data-goto="scan">Scan your first card</button>
        </div>
      </section>

      <!-- SCAN -->
      <section class="view" id="view-scan" aria-label="Scan">
        <div class="scanner">
          <video id="video" playsinline muted autoplay></video>
          <canvas id="captureCanvas" hidden></canvas>
          <div class="scan-overlay">
            <div class="scan-frame"><span></span><span></span><span></span><span></span></div>
            <div class="scan-hint" id="scanHint">Line the card up inside the frame</div>
          </div>
          <div class="scanner-off" id="scannerOff">
            <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            <p id="scannerMsg">Use your camera to scan a card</p>
            <button class="btn primary" id="startCamBtn">Start camera</button>
          </div>
        </div>
        <div class="scan-actions">
          <label class="btn ghost" for="photoInput">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            Photo
          </label>
          <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
          <button class="shutter" id="shutterBtn" aria-label="Scan card" disabled><span></span></button>
          <button class="btn ghost" id="stopCamBtn" disabled>Stop</button>
        </div>
        <div class="scan-status" id="scanStatus" hidden></div>

        <form class="search-bar" id="searchForm">
          <input type="search" id="searchInput" placeholder="Or search: “Charizard”, “Pikachu 58/102”…" aria-label="Search cards" autocomplete="off">
          <button class="btn primary" type="submit">Search</button>
        </form>
        <div class="results-head" id="resultsHead" hidden></div>
        <div class="results-grid" id="results"></div>
      </section>
    </main>

    <nav class="tabbar" aria-label="Main">
      <button class="tab active" data-goto="portfolio">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="10" rx="1.5"/><rect x="14" y="4" width="7" height="10" rx="1.5"/><path d="M3 19h18"/></svg>
        <span>Portfolio</span>
      </button>
      <button class="tab tab-scan" data-goto="scan" aria-label="Scan">
        <span class="tab-scan-btn">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>
        </span>
        <span>Scan</span>
      </button>
      <button class="tab" data-goto="scan" data-focus-search>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <span>Search</span>
      </button>
    </nav>
  </div>

  <!-- Card detail / add sheet -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <button class="sheet-close" id="sheetClose" aria-label="Close">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
